# Robonix deploy manifest for AgileX Piper + Orbbec vertical-grasp workspace.
#
# Current package profile on this branch:
#   primitive: orbbec_camera -> piper_ctl -> piper_description
#   service:   llm_detect -> grasp_pose -> roboarm_ik
#   skill:     pick
#
# Compared with the older deploy shape on `main`, this branch keeps the
# `pick ok` pipeline (grasp_pose + roboarm_ik) but now fetches every remote
# package from the `syswonder` GitHub organization.
#
# Angled-grasp wiring (this manifest branch = `angle-grasp`):
# The vertical top-down grasp pipeline is extended with a coarse
# principal-axis orientation channel so the gripper yaw is chosen from
# the object's principal axis instead of always the bbox long edge.
# Three packages are pinned to a matching `feature/orientation-detection`
# branch to form the contract end-to-end:
#   * service-object-detect-rbnx  (llm_detect):  emits `orientation`
#     ∈ {vertical, horizontal, diag_tlbr, diag_trbl, unknown} alongside
#     the bbox (prompt + DetectObject.srv schema updated).
#   * skill-pick-vertical-grasp-rbnx (pick):     threads the label from
#     detect_object into grasp_request (GraspRequest.srv gains
#     `string orientation`; atlas_bridge forwards it).
#   * service-grasp-pose-rbnx     (grasp_pose):  maps the label to a
#     canonical wrist yaw (_ORIENTATION_YAW_RAD); "unknown" / missing
#     falls back to the legacy bbox long-edge heuristic.
# OBB (rotated-bbox) detectors are NOT wired in — the `box_rotation_deg`
# knob under grasp_pose is reserved for a future OBB detector and has
# no runtime effect today. See each block below for details.
#
# Boot order is declaration order:
#   1. rbnx starts system services.
#   2. soma starts primitive packages.
#   3. rbnx starts service packages.
#   4. soma initializes skill packages after the stage2 trigger.
#
# Keep providers before consumers.

manifestVersion: 1
name: robonix-piper-grasp-deploy
catalog:
  name: robonix.robot.agilex.piper_grasp
  version: 0.2.0
  description: Robonix deploy manifest for AgileX Piper with Orbbec Dabai DCW and llm_detect + grasp_pose + roboarm_ik vertical grasp pipeline.
  tags: [robot, deploy, agilex, piper_grasp, camera, manipulation, perception, grasp]
  maintainers:
    - lhw2002426 <lhw2002426@users.noreply.github.com>

env: {}

system:
  atlas:
    listen: 127.0.0.1:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${PILOT_MODEL}
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info
  soma:
    listen: 127.0.0.1:50091
    log: info
    provider_id: soma
    robot_yaml: soma.yaml
    config: soma_config.local.yaml

primitive:
  # Orbbec Dabai DCW RGB camera. Depth is disabled for vertical grasp.
  - name: orbbec_camera
    url: https://github.com/syswonder/primitive-orbbec-dabai_dcw-camera-rbnx
    branch: main
    config:
      camera_name: camera
      enable_depth: false
      depth_registration: false
      enable_d2c_viewer: false
      color_width: 1280
      color_height: 720
      color_fps: 10
      color_format: YUYV
      depth_width: 640
      depth_height: 400
      depth_fps: 10
      sentinel_timeout_s: 30.0

  # Piper control must start before piper_description and roboarm_ik.
  - name: piper_ctl
    url: https://github.com/syswonder/primitive-agilex-piper-arm-rbnx
    branch: main
    config:
      can_port: can_piper
      can_bitrate: 1000000
      can_usb_address: "1-4.1:1.0"
      auto_can_setup: false
      auto_enable: true
      gripper_exist: true
      gripper_val_mutiple: 2
      sentinel_timeout_s: 30.0

  # Publishes the Piper TF tree from /arm/joint_states_single.
  - name: piper_description
    url: https://github.com/syswonder/primitive-agilex-piper-description-rbnx
    branch: main
    config: {}

service:
  # RGB image -> VLM bbox (+ orientation label). Depth is intentionally
  # skipped.
  #
  # This deploy uses the orientation-aware detector branch:
  # `feature/orientation-detection`. In addition to the standard bbox,
  # the LLM prompt on that branch asks for a coarse principal-axis
  # `orientation` field, quantized to one of
  #   { vertical, horizontal, diag_tlbr, diag_trbl, unknown }
  # (see service-object-detect-rbnx/config/prompts.toml and the
  # DetectObject.srv schema). The value is forwarded by the pick skill
  # into grasp_pose to fix the gripper yaw — see the grasp_pose block
  # below for the consumer side.
  - name: llm_detect
    url: https://github.com/syswonder/service-object-detect-rbnx
    branch: feature/orientation-detection
    config:
      llm_base_url: ${VLM_BASE_URL}
      llm_api_key: ${VLM_API_KEY}
      llm_model: ${VLM_MODEL}
      llm_timeout_s: 60.0
      temperature: 0.0
      rotation_cam2arm: true
      skip_depth: true
      rgb_topic: ""
      camera_info_topic: ""

  # Bbox (+ orientation) -> arm/base_link top-down grasp pose.
  #
  # This deploy uses the orientation-aware grasp pose branch:
  # `feature/orientation-detection`. The gripper yaw is driven by the
  # `orientation` label produced upstream by llm_detect (see the
  # llm_detect block above) and threaded through by the pick skill
  # (skill-pick-vertical-grasp-rbnx@feature/orientation-detection,
  # atlas_bridge._stage_grasp_request). The mapping label -> yaw lives
  # in service-grasp-pose-rbnx/grasp_pose/main.py (_ORIENTATION_YAW_RAD).
  # The legacy "bbox longer edge" heuristic is used only as a fallback
  # when orientation is missing or resolves to "unknown".
  - name: grasp_pose
    url: https://github.com/syswonder/service-grasp-pose-rbnx
    branch: feature/orientation-detection
    config:
      hand_eye_calibration_file: ../../hand-eye-data/2d_homography.npy
      default_desktop_height: -0.21
      catch_offset: 0.00
      # OBB (oriented bounding box) is NOT wired in yet: the current LLM
      # detector and standard axis-aligned YOLO both emit 4-element
      # bboxes, so this value has no effect in today's deployment. It is
      # reserved for a future OBB detector (YOLO-OBB / cv2.minAreaRect)
      # that would pass a 5th rotation element in bbox_2d. Angled grasps
      # in this manifest come from the LLM's `orientation` label, not
      # from this rotation value.
      box_rotation_deg: 0.0
      output_frame: "arm/base_link"
      approach_dist: 0.30

  # Executes explicit gRPC execute_grasp/reset/teach_safe/put_down calls from pick skill.
  - name: roboarm_ik
    url: https://github.com/syswonder/service-roboarm-ik-rbnx
    branch: main
    config:
      # Fixed observation pose used by manipulation/reset before detection.
      # Units are degrees for joint1..joint6.
      init_joints_deg: [-1.837021, 93.526178, -36.180726, -5.065302, 17.399731, -0.323827]
      # init_joints_deg: [0.023987, 72.176551, -59.083526, -3.669045, 59.316402, -2.063901]

      teach_safe_joints_deg: [3.358211, 2.0, -2.0, -6.708426, 18.580102, 5.898858]
      # put_down first carries the object here, then opens the gripper, then
      # returns to teach_safe_joints_deg. Units are degrees for joint1..joint6.
      put_down_joints_deg: [2.990407, 166.783154, -70.978190, -4.119805, 1.697096, 10.370476]
      reset_feedback_timeout_s: 8.0
      carry_to_teach_safe_waypoints_deg:
        - [1.711088, 81.721467, -80.833939, -3.718019, 49.375697, -6.657454]
      max_gripper_width: 0.08

skill:
  # User-facing pick(object_name) skill.
  #
  # This deploy uses the orientation-aware pick branch:
  # `feature/orientation-detection`. In that branch pick_skill reads the
  # `orientation` field returned by llm_detect and forwards it into
  # grasp_pose (GraspRequest.srv gains a `string orientation` field, and
  # pick_skill/atlas_bridge.py copies it through). Together with the
  # matching llm_detect + grasp_pose branches above this closes the
  # detector -> skill -> grasp_pose orientation contract; on `main` the
  # field simply doesn't exist and grasp_pose falls back to the bbox
  # long-edge yaw.
  - name: pick
    url: https://github.com/syswonder/skill-pick-vertical-grasp-rbnx
    branch: feature/orientation-detection
    config:
      park_at_teach_safe_after_pick: true
